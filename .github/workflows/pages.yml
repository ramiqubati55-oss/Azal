name: Validate static GitHub Pages preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview files
        run: |
          test -s index.html
          test -s "إدارة_صحية.html"
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              pass
          for path in [Path("index.html"), Path("إدارة_صحية.html")]:
              html = path.read_text(encoding="utf-8")
              assert "<html" in html.lower() and "</html>" in html.lower(), path
              Parser().feed(html)
              print(f"Validated {path}")
          PY
