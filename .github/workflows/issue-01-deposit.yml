name: Validate AUHD 725-record international deposit source

on:
  push:
    branches: [main]
    paths:
      - 'deposit/issue-01/**'
      - 'data/research-index/issue-01/**'
      - 'research-app/data/AUHD_Research_Index_Issue_01_725_Records.csv'
      - '.github/workflows/issue-01-deposit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-issue-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-preserving data transformation
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          source_path = Path("data/research-index/issue-01/AUHD_Research_Index_Issue_01_725_Records.csv")
          with source_path.open(encoding="utf-8-sig", newline="") as source:
              originals = list(csv.DictReader(source))
          with Path("deposit/issue-01/records.jsonl").open(encoding="utf-8") as f:
              records = [json.loads(line) for line in f if line.strip()]
          manifest = json.loads(Path("deposit/issue-01/manifest.json").read_text(encoding="utf-8"))
          assert len(originals) == len(records) == manifest["record_count"] == 725
          assert len({r["local_id"] for r in records}) == 725
          assert len({r["title"] for r in records}) == 725
          for i, (source, record) in enumerate(zip(originals,records)):
              assert source["رقم السجل"] == record["local_id"], i
              assert source["العنوان"] == record["title"], i
              assert source["رابط DOI"] == (record["doi_url"] or ""), i
              assert source["المؤلفون"] == (record["authors"] or ""), i
              assert source["رابط النسخة المفتوحة"] == (record["open_copy_url"] or ""), i
              assert record["institutional_catalog_review"]["status"] == "confirmed_by_university_representative", i
              assert record["full_text_deposited_within_auhd"] is False, i
          assert sum(bool(x["doi_url"]) for x in records) == 654
          assert sum(bool(x["authors"]) for x in records) == 1
          assert sum(bool(x["open_copy_url"]) for x in records) == 3
          assert manifest["oai_pmh_endpoint"] is None
          assert manifest["openaire_provider_registered"] is False
          assert manifest["opendoar_registered"] is False
          print(f"PASS: {len(records)} preserved source records, DOI/author/open-copy counts, provenance and conservative rights flags")
          PY
